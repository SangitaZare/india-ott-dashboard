# Runs the data validation and every test on each pull request and on every push to main.
# A red X on a pull request means the data or the code broke a rule - fix it before merging.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Data validation + tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # CLAUDE.md: Python 3.11+. Test the oldest supported version and a recent one.
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js (for the family plan picker tests)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate the data (CLAUDE.md section 2 rules)
        run: python scripts/validate_data.py

      - name: Build the database and run every analysis query
        run: |
          python scripts/build_db.py
          python scripts/run_analysis.py > /dev/null

      - name: Run all tests (Python + JavaScript picker tests)
        run: python -m pytest -q
